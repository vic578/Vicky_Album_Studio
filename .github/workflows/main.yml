name: Build Vicky Album Studio

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: windows-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build EXE
    run: pyinstaller --noconfirm --onefile --windowed --name "VickyAlbumStudio" app.py

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: Vicky-Album-Studio-Windows-EXE
      path: dist/VickyAlbumStudio.exe
